<html>
<head>
<meta charset="UTF-8">
<meta name="authoring-tool" content="Adobe_Animate_CC">
<title>Project4</title>
<!-- write your code here -->
<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
<script src="Project4.js"></script>
<script>
var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;
function init() {
	canvas = document.getElementById("canvas");
	anim_container = document.getElementById("animation_container");
	dom_overlay_container = document.getElementById("dom_overlay_container");
	var comp=AdobeAn.getComposition("AA3D104A9F80FD4DB6A4CAC0A5F157E3");
	var lib=comp.getLibrary();
	var loader = new createjs.LoadQueue(false);
	loader.addEventListener("fileload", function(evt){handleFileLoad(evt,comp)});
	loader.addEventListener("complete", function(evt){handleComplete(evt,comp)});
	var lib=comp.getLibrary();
	loader.loadManifest(lib.properties.manifest);
}
function handleFileLoad(evt, comp) {
	var images=comp.getImages();	
	if (evt && (evt.item.type == "image")) { images[evt.item.id] = evt.result; }	
}
function handleComplete(evt,comp) {
	//This function is always called, irrespective of the content. You can use the variable "stage" after it is created in token create_stage.
	var lib=comp.getLibrary();
	var ss=comp.getSpriteSheet();
	var queue = evt.target;
	var ssMetadata = lib.ssMetadata;
	for(i=0; i<ssMetadata.length; i++) {
		ss[ssMetadata[i].name] = new createjs.SpriteSheet( {"images": [queue.getResult(ssMetadata[i].name)], "frames": ssMetadata[i].frames} )
	}
	exportRoot = new lib.Project4();
	stage = new lib.Stage(canvas);	
	//Registers the "tick" event listener.
	fnStartAnimation = function() {
		stage.addChild(exportRoot);
		createjs.Ticker.framerate = lib.properties.fps;
		createjs.Ticker.addEventListener("tick", stage);
	}	    
	//Code to support hidpi screens and responsive scaling.
	AdobeAn.makeResponsive(false,'both',false,1,[canvas,anim_container,dom_overlay_container]);	
	AdobeAn.compositionLoaded(lib.properties.id);
	fnStartAnimation();
}
</script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
  }

  #animation_container {
    position: absolute !important;
    top: 50% !important;
    left: 50% !important;
    transform-origin: center center;
  }
</style>
</head>
<body onload="init();" style="margin:0px;">
	<div id="animation_container" style="background-color:rgba(255, 255, 255, 1.00); width:2480px; height:3508px">
		<canvas id="canvas" width="2480" height="3508" style="position: absolute; display: block; background-color:rgba(255, 255, 255, 1.00);"></canvas>
		<div id="dom_overlay_container" style="pointer-events:none; overflow:hidden; width:2480px; height:3508px; position: absolute; left: 0px; top: 0px; display: block;">
		</div>
	</div>
<script>
// ---- fill these in ----
var DOC_WIDTH = 2480;     	// Modify > Document > Width
var DOC_HEIGHT = 3508;       // Modify > Document > Height
var BUILDING_HEIGHT = 10500;  // H of the Building instance
// -----------------------

// scale the whole canvas to fit the window, centered
function fitToWindow() {
    var container = document.getElementById("animation_container");
    var scale = Math.min(window.innerWidth / DOC_WIDTH, window.innerHeight / DOC_HEIGHT);
    container.style.transform = "translate(-50%, -50%) scale(" + scale + ")";
}
window.addEventListener("load", fitToWindow);
window.addEventListener("resize", fitToWindow);

window.addEventListener("load", function () {
    var waitForRoot = setInterval(function () {
        if (typeof exportRoot !== "undefined" && exportRoot.Building) {
            clearInterval(waitForRoot);
            setupScroll();
        }
    }, 50);
});

function setupScroll() {
    var building = exportRoot.Building;
    var startY = building.y;

    var minScroll = 0;
    var maxScroll = Math.max(0, BUILDING_HEIGHT - DOC_HEIGHT);

    var targetScroll = 0;
    var currentScroll = 0;
    var scrollSpeed = 1;
    var easing = 0.08; // lower = smoother/slower, higher = snappier

    window.addEventListener("wheel", function (evt) {
        evt.preventDefault();
        targetScroll += evt.deltaY * scrollSpeed;
        if (targetScroll < minScroll) targetScroll = minScroll;
        if (targetScroll > maxScroll) targetScroll = maxScroll;
    }, { passive: false });

    function update() {
        currentScroll += (targetScroll - currentScroll) * easing;
        building.y = startY - currentScroll;
        requestAnimationFrame(update);
    }
    update();
}
</script>
</body>
</html>
